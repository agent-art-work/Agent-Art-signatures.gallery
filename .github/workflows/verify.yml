name: Verify

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Expanded real-PostgreSQL fault suites need more job time; application,
    # admission, signer and transport deadlines are unchanged.
    timeout-minutes: 35
    env:
      # All provider calls in this job are mocked. Never pass billing credentials.
      XAI_API_KEY: ''
      OPEN_MINT_X_BEARER_TOKEN: ''
      OPEN_MINT_TEST_HTTP: '1'
      OPEN_MINT_TEST_POSTGRES: '1'
      OPEN_MINT_TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1
      - name: Install locked dependencies
        run: npm ci
      - name: Install isolated database test binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Verify renderer and slogan locks
        run: npm run renderer:verify
      - name: Check types
        run: npm run typecheck
      - name: Test with coverage ratchet and real loopback HTTP
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Test contracts offline
        run: npm run test:contract
      - name: Verify locked generative release candidate and deployment planning
        run: |
          npm run generative:release:check
          npm run test:generative:release
          npm run test:generative:deployment:coverage
      - name: Check locked numerical worksheet and topology regression
        run: |
          npm run generative:numerical-review
          npm run test:generative:numerics
      - name: Reject unsafe offline Sepolia operating plans
        run: npm run test:generative:operating-plan
      - name: Verify declared active governance history with dedicated coverage
        run: npm run test:generative:active-state:coverage
      - name: Verify internal single-operation admission and locked chain composition
        run: npm run test:generative:admission:coverage
      - name: Verify local provider-leg admission against disposable PostgreSQL
        run: npm run test:generative:assessment-admission
      - name: Verify local signing and wallet admission against disposable PostgreSQL
        run: npm run test:generative:mint-admission
      - name: Verify private saved-result reuse against disposable PostgreSQL
        run: npm run test:generative:reuse-admission
      - name: Verify pinned signed local review and revocation
        run: npm run test:generative:local-review
      - name: Verify complete guarded local runtime and cancellation against disposable PostgreSQL
        run: npm run test:generative:local-runtime
      - name: Verify pinned review files, safe file reads and local startup preflight
        run: |
          npm run test:generative:review-files
          npm run test:generative:review-startup
      - name: Verify exact staging database schema, grants and reviewed profiles
        run: npm run test:generative:database-certification
      - name: Verify read-only paused Sepolia startup and bounded HTTP without public effects
        run: |
          npm run test:generative:readiness-http
          npm run test:generative:staging-readiness
      - name: Verify exact deployed RC immutables and reject local genesis
        run: npm run generative:deployment:rehearsal -- --execute-local-test-transactions
      - name: Verify future staging worker locally with guarded ports and mocked providers
        run: |
          npm run test:generative:staging-review
          npm run test:generative:staging-assessment
      - name: Verify staging cookies and bounded proxy transport with isolated loopback HTTP
        run: npm run test:generative:staging-transport
      - name: Verify staging canonical URLs, private metadata and finalized-only PNG cards
        run: npm run test:generative:staging-sharing
      - name: Verify future staging input authority and wallet fences locally without broadcast
        run: npm run test:generative:staging-mint
      - name: Verify private future staging runtime, site and verified reveal on loopback mocks
        run: npm run test:generative:staging-runtime
      - name: Rehearse isolated RC1 backup, restore and projection recovery
        run: npm run test:generative:staging-restore
      - name: Verify bounded staging recovery inspection, proof and operator approval
        run: |
          npm run test:generative:staging-recovery-unit
          npm run test:generative:staging-recovery-pg
      - name: Rehearse explicit v2 staging recovery and restore with disposable infrastructure
        run: npm run test:generative:staging-recovery-flow
      - name: Verify actual activation and governance transactions on disposable Anvil
        run: npm run generative:active-state:rehearsal -- --execute-local-test-transactions
      - name: Verify candidate full metadata reads against shared application limits
        run: npm run generative:read-limits -- --execute-local-test-transactions
      - name: Rehearse unactivated release candidate backend on disposable Anvil and PostgreSQL
        run: npm run generative:rehearsal -- --execute-local-test-transactions --release-candidate --quick --mint --backend
      - name: Rehearse file-backed review startup and writer restart on disposable Anvil
        run: npm run generative:rehearsal -- --execute-local-test-transactions --release-candidate --quick --mint --backend --review-files
      - name: Verify experimental generative parity and input-only mint boundary
        run: npm run generative:rehearsal -- --execute-local-test-transactions --quick --mint --backend
      - name: Verify deployment manifest tooling
        run: |
          npm run test:manifest
          npm run test:manifest:roles
          npm run test:open:manifest
          npm run test:onchain:manifest
      - name: Rehearse fixture mint on isolated Anvil
        shell: bash
        run: |
          export NODE_ENV=development
          export PORT=3021 OPEN_MINT_RPC_PORT=18561
          export OPEN_MINT_ORIGIN=http://127.0.0.1:3021
          export OPEN_MINT_DATA_DIR=.local/open-mint/ci-fixture
          node --import tsx src/main.ts --fixture --local-chain > "$RUNNER_TEMP/open-mint-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill -TERM "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --silent --fail --max-time 1 "$OPEN_MINT_ORIGIN/" >/dev/null; then ready=1; break; fi
            kill -0 "$fixture_pid" || { cat "$RUNNER_TEMP/open-mint-fixture.log"; exit 1; }
            sleep 1
          done
          test "$ready" = 1 || { cat "$RUNNER_TEMP/open-mint-fixture.log"; exit 1; }
          OPEN_MINT_TEST_ORIGIN="$OPEN_MINT_ORIGIN" npm run open:rehearsal -- --execute-local-test-transactions
